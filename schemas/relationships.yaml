temporal_rules:
- Historical incidents must precede pilot incidents.
- H component may use only incidents with incident_timestamp earlier than the current
  pilot incident.
- 'For each incident: failure_timestamp <= detection_timestamp <= diagnosis_timestamp
  <= decision_timestamp <= recovery/validation timestamps when those events exist.'
- Evaluation/ground-truth fields must not be used as decision-time inputs.
